services:
  postgres:
    image: postgres:17-alpine
    container_name: van-reservation-db
    environment:
      POSTGRES_USER: van
      POSTGRES_PASSWORD: van
      POSTGRES_DB: van_reservation
    ports:
      - "5433:5432"
    volumes:
      - van-reservation-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U van -d van_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  van-reservation-pgdata:
